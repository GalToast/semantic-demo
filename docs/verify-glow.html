<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus Anchor Glow — Visual Verification</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info { position: absolute; top: 10px; left: 10px; color: #4ecdc4; font-family: sans-serif; }
    canvas { display: block; }
  </style>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

    // Procedural glow texture (identical to focus-anchor-indicator.ts)
    function createGlowTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const center = size / 2;
      const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
      gradient.addColorStop(0.0, 'rgba(255, 255, 255, 0.9)');
      gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.4)');
      gradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.1)');
      gradient.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.z = 2;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Ambient mycelium background (simulated spore field)
    const sporeGeo = new THREE.BufferGeometry();
    const sporeCount = 2000;
    const positions = new Float32Array(sporeCount * 3);
    for (let i = 0; i < sporeCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 10 - 5;
    }
    sporeGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const sporeMat = new THREE.PointsMaterial({ color: 0x4ecdc4, size: 0.03, transparent: true, opacity: 0.6 });
    scene.add(new THREE.Points(sporeGeo, sporeMat));

    // Focus anchor indicator group
    const group = new THREE.Group();
    group.renderOrder = 4;
    scene.add(group);

    // Ring (warm amber)
    const ringGeo = new THREE.RingGeometry(0.072, 0.085, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xfff4ba,
      transparent: true,
      opacity: 0.78,
      side: THREE.DoubleSide,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.renderOrder = 4;
    group.add(ring);

    // Glow (procedural)
    const glowTexture = createGlowTexture();
    const spriteMat = new THREE.SpriteMaterial({
      map: glowTexture,
      color: 0x8ff8ed,
      transparent: true,
      opacity: 0.0,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending
    });
    const glow = new THREE.Sprite(spriteMat);
    glow.scale.set(0.13, 0.13, 1);
    glow.renderOrder = 5;
    group.add(glow);

    // Animation
    let opacity = 0.0;
    const OPACITY_CEIL = 0.95;
    const FADE_RATE = 0.12;
    const PULSE_FREQ = 0.7;
    const PULSE_AMP = 0.12;
    const BASE_SCALE = 0.13;

    function animate(now) {
      requestAnimationFrame(animate);
      const t = now / 1000;

      // Fade in
      opacity += (OPACITY_CEIL - opacity) * FADE_RATE;
      spriteMat.opacity = opacity;

      // Pulse scale
      const pulse = Math.sin(t * Math.PI * 2 * PULSE_FREQ);
      const s = BASE_SCALE * (1.0 + pulse * PULSE_AMP);
      glow.scale.set(s, s, 1);

      // Orbit the group slightly for visual interest
      group.rotation.z = t * 0.1;

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // Update info
    document.getElementById('info').innerText = 'Focus Anchor Indicator — Procedural Radial Glow\nWhite-to-transparent alpha mask × 0x8ff8ed tint\nAdditive blending on dark mycelium background';
  </script>
</head>
<body>
  <div id="info"></div>
</body>
</html>
