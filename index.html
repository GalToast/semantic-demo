<html lang="en">
<head>

    <meta

        content="A recruiter-facing case study for an interactive semantic explorer over 8,406 Montgomery County business records."
    >
    <link rel="canonical" href="https://mccullough.cloud/semantic-demo/case-study.html">
    <meta property="og:title" content="Montgomery County Semantic Explorer">
    <meta
        property="og:description"
        content="8,406 local business records organized by what they do, not just where they are."
    >
    <meta property="og:url" content="https://mccullough.cloud/semantic-demo/case-study.html">
    <meta property="og:image" content="https://mccullough.cloud/semantic-demo/recruiter-assets/semantic-demo-case-study-og-motion410-clean.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Montgomery County Semantic Explorer">
    <meta
        name="twitter:description"
        content="8,406 local business records organized by what they do, not just where they are."
    >
    <meta name="twitter:image" content="https://mccullough.cloud/semantic-demo/recruiter-assets/semantic-demo-case-study-og-motion410-clean.png">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2306100f'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2361d8ca' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23e2c66a'/%3E%3C/svg%3E">
    <script>
        (function () {
            const target = new URL('case-study.html', window.location.href);
            const explorer = new URL('./', window.location.href);
            target.search = window.location.search;
            target.hash = window.location.hash;
            explorer.search = window.location.search;
            explorer.hash = window.location.hash;

            window.addEventListener('DOMContentLoaded', function () {
                const caseStudyLink = document.getElementById('case-study-link');
                const explorerLink = document.getElementById('explorer-link');
                if (caseStudyLink) caseStudyLink.href = target.toString();
                if (explorerLink) explorerLink.href = explorer.toString();
            });

            window.setTimeout(function () {
                window.location.replace(target.toString());
            }, 3200);
        }());
    </script>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0a0a1a;
            color: #f0f0f5;
            font: 16px/1.5 "Nunito Sans", system-ui, sans-serif;
        }
        main {
            max-width: 42rem;
            padding: 2rem;
            text-align: center;
        }
        .byline {
            color: rgba(240, 240, 245, 0.68);
            font-size: 0.95rem;
        }
        a {
            color: #00f5d4;
        }
    </style>
</head>
<body>
    <main>
        <h1>Montgomery County Semantic Explorer</h1>
        <p class="byline">Built by Fred McCullough.</p>
        <p>Mapping 8,406 local businesses by what they do, not just where they are.</p>
        <p>Taking you to the recruiter-facing case study in a moment.</p>
        <p>If you came for the live app, <a id="explorer-link" href="./">open the live explorer</a>.</p>
        <p><a id="case-study-link" href="case-study.html">Read the case study now</a>.</p>
    </main>
</body>
</html>
