    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {

      height: 100%;
      overflow: hidden;
      background: #071018;
      color: #e0f0f0;
      font-family: 'Nunito Sans', sans-serif;

    /* Skip link for accessibility */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      z-index: 9999;
      padding: 0.5rem 1rem;
      background: #0d2137;
      color: #4ecdc4;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; }

    /* Visually hidden but accessible to screen readers */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* App root fills viewport */
    #app {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 0;
    }

  </style>
