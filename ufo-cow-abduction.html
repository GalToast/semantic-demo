<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UFO Abduction — Area 51, Roswell NM</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: #000;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                overflow: hidden;
                font-family: 'Courier New', monospace;
            }
            .scene {
                width: 100vw;
                height: 100vh;
                max-width: 1200px;
                max-height: 900px;
            }
            svg {
                width: 100%;
                height: 100%;
            }

            @keyframes twinkle {
                0%,
                100% {
                    opacity: 0.9;
                }
                50% {
                    opacity: 0.3;
                }
            }
            .star {
                animation: twinkle 3s ease-in-out infinite;
            }
            .star:nth-child(odd) {
                animation-duration: 4s;
                animation-delay: 1s;
            }
            .star:nth-child(3n) {
                animation-duration: 2.5s;
                animation-delay: 0.5s;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.3;
                }
            }
            .ufo-light {
                animation: pulse 1.5s ease-in-out infinite;
            }
            .ufo-light:nth-child(2) {
                animation-delay: 0.2s;
            }
            .ufo-light:nth-child(3) {
                animation-delay: 0.4s;
            }
            .ufo-light:nth-child(4) {
                animation-delay: 0.6s;
            }
            .ufo-light:nth-child(5) {
                animation-delay: 0.8s;
            }
            .ufo-light:nth-child(6) {
                animation-delay: 1s;
            }
            .ufo-light:nth-child(7) {
                animation-delay: 1.2s;
            }

            @keyframes floatUp {
                0% {
                    opacity: 0.5;
                }
                100% {
                    opacity: 0;
                    transform: translateY(-20px);
                }
            }
            .particle {
                animation: floatUp 3s ease-out infinite;
            }
            .particle:nth-child(2) {
                animation-delay: 0.5s;
            }
            .particle:nth-child(3) {
                animation-delay: 1s;
            }
            .particle:nth-child(4) {
                animation-delay: 1.5s;
            }
            .particle:nth-child(5) {
                animation-delay: 2s;
            }
            .particle:nth-child(6) {
                animation-delay: 2.5s;
            }

            @keyframes catBlink {
                0%,
                90%,
                100% {
                    opacity: 0.8;
                }
                95% {
                    opacity: 0;
                }
            }
            .cat-eyes {
                animation: catBlink 4s ease-in-out infinite;
            }

            @keyframes antennaBlink {
                0%,
                100% {
                    fill: #ff4444;
                }
                50% {
                    fill: #ff8888;
                }
            }
            .antenna {
                animation: antennaBlink 1s ease-in-out infinite;
            }

            @keyframes titleGlow {
                0%,
                100% {
                    opacity: 0.9;
                }
                50% {
                    opacity: 1;
                }
            }
            .title-text {
                animation: titleGlow 3s ease-in-out infinite;
            }

            @keyframes beamPulse {
                0%,
                100% {
                    opacity: 0.6;
                }
                50% {
                    opacity: 0.8;
                }
            }
            .beam-core {
                animation: beamPulse 2s ease-in-out infinite;
            }

            @keyframes debrisSpin {
                0% {
                    opacity: 0.7;
                }
                50% {
                    opacity: 0.3;
                    transform: rotate(180deg);
                }
                100% {
                    opacity: 0.7;
                }
            }
            .debris {
                animation: debrisSpin 4s linear infinite;
            }
            .debris:nth-child(2) {
                animation-delay: 1s;
                animation-duration: 5s;
            }
            .debris:nth-child(3) {
                animation-delay: 2s;
                animation-duration: 3.5s;
            }
            .debris:nth-child(4) {
                animation-delay: 0.5s;
                animation-duration: 4.5s;
            }
            .debris:nth-child(5) {
                animation-delay: 1.5s;
                animation-duration: 6s;
            }

            @keyframes scorchPulse {
                0%,
                100% {
                    opacity: 0.3;
                }
                50% {
                    opacity: 0.5;
                }
            }
            .scorch-glow {
                animation: scorchPulse 3s ease-in-out infinite;
            }
        </style>
    </head>
    <body>
        <div class="scene">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#0a0a2e" />
                        <stop offset="60%" stop-color="#1a1a4e" />
                        <stop offset="100%" stop-color="#2d1b4e" />
                    </linearGradient>
                    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffffcc" stop-opacity="0.3" />
                        <stop offset="100%" stop-color="#ffffcc" stop-opacity="0" />
                    </radialGradient>
                    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#44ffaa" stop-opacity="0.6" />
                        <stop offset="100%" stop-color="#44ffaa" stop-opacity="0.05" />
                    </linearGradient>
                    <linearGradient id="cowUnderbelly" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#44ffaa" stop-opacity="0.3" />
                        <stop offset="100%" stop-color="#f5f0e8" stop-opacity="0.9" />
                    </linearGradient>
                    <linearGradient id="ufoBody" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#8899aa" />
                        <stop offset="50%" stop-color="#667788" />
                        <stop offset="100%" stop-color="#445566" />
                    </linearGradient>
                    <linearGradient id="ufoDome" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#aaddff" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#4488bb" stop-opacity="0.4" />
                    </linearGradient>
                    <radialGradient id="scorchGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#44ffaa" stop-opacity="0.25" />
                        <stop offset="100%" stop-color="#44ffaa" stop-opacity="0" />
                    </radialGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <filter id="softGlow">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- Sky -->
                <rect width="1000" height="600" fill="url(#skyGrad)" />

                <!-- Stars -->
                <g class="stars">
                    <circle class="star" cx="50" cy="30" r="1.5" fill="#fff" opacity="0.9" />
                    <circle class="star" cx="120" cy="80" r="1" fill="#fff" opacity="0.7" />
                    <circle class="star" cx="200" cy="25" r="1.2" fill="#fff" opacity="0.8" />
                    <circle class="star" cx="310" cy="60" r="0.8" fill="#fff" opacity="0.6" />
                    <circle class="star" cx="420" cy="20" r="1.5" fill="#fff" opacity="0.9" />
                    <circle class="star" cx="500" cy="70" r="1" fill="#fff" opacity="0.7" />
                    <circle class="star" cx="610" cy="35" r="1.3" fill="#fff" opacity="0.8" />
                    <circle class="star" cx="700" cy="55" r="0.9" fill="#fff" opacity="0.6" />
                    <circle class="star" cx="750" cy="15" r="1.1" fill="#fff" opacity="0.85" />
                    <circle class="star" cx="80" cy="120" r="0.8" fill="#fff" opacity="0.5" />
                    <circle class="star" cx="160" cy="100" r="1.4" fill="#fff" opacity="0.75" />
                    <circle class="star" cx="280" cy="110" r="1" fill="#fff" opacity="0.6" />
                    <circle class="star" cx="380" cy="90" r="0.7" fill="#fff" opacity="0.5" />
                    <circle class="star" cx="480" cy="45" r="1.3" fill="#fff" opacity="0.8" />
                    <circle class="star" cx="560" cy="100" r="0.9" fill="#fff" opacity="0.55" />
                    <circle class="star" cx="650" cy="80" r="1.1" fill="#fff" opacity="0.7" />
                    <circle class="star" cx="730" cy="110" r="0.8" fill="#fff" opacity="0.5" />
                    <circle class="star" cx="30" cy="160" r="1" fill="#fff" opacity="0.6" />
                    <circle class="star" cx="350" cy="140" r="0.9" fill="#fff" opacity="0.5" />
                    <circle class="star" cx="550" cy="130" r="1.2" fill="#fff" opacity="0.65" />
                    <circle class="star" cx="680" cy="150" r="0.7" fill="#fff" opacity="0.45" />
                    <circle class="star" cx="850" cy="40" r="1" fill="#fff" opacity="0.7" />
                    <circle class="star" cx="920" cy="90" r="1.3" fill="#fff" opacity="0.8" />
                    <circle class="star" cx="960" cy="20" r="0.8" fill="#fff" opacity="0.6" />
                    <circle class="star" cx="900" cy="130" r="1.1" fill="#fff" opacity="0.7" />
                </g>

                <!-- Moon -->
                <circle cx="850" cy="120" r="60" fill="url(#moonGlow)" />
                <circle cx="850" cy="120" r="30" fill="#ffffdd" opacity="0.9" />
                <circle cx="840" cy="112" r="6" fill="#eeeebb" opacity="0.5" />
                <circle cx="858" cy="125" r="4" fill="#eeeebb" opacity="0.4" />
                <circle cx="845" cy="130" r="3" fill="#eeeebb" opacity="0.35" />

                <!-- Radio tower silhouette on horizon (far left) -->
                <g transform="translate(100, 350)" opacity="0.25">
                    <line x1="0" y1="0" x2="0" y2="80" stroke="#1a1a2e" stroke-width="3" />
                    <line x1="-12" y1="10" x2="12" y2="10" stroke="#1a1a2e" stroke-width="2" />
                    <line x1="-10" y1="25" x2="10" y2="25" stroke="#1a1a2e" stroke-width="2" />
                    <line x1="-8" y1="40" x2="8" y2="40" stroke="#1a1a2e" stroke-width="2" />
                    <line x1="-6" y1="55" x2="6" y2="55" stroke="#1a1a2e" stroke-width="2" />
                    <circle cx="0" cy="0" r="2" fill="#ff3333" opacity="0.6" />
                </g>

                <!-- Distant pickup truck with headlights (far left horizon) -->
                <g transform="translate(220, 410)" opacity="0.4">
                    <!-- Truck body -->
                    <rect x="0" y="8" width="30" height="10" rx="2" fill="#1a1a2a" />
                    <rect x="20" y="2" width="12" height="10" rx="2" fill="#1a1a2a" />
                    <!-- Wheels -->
                    <circle cx="8" cy="20" r="3" fill="#0a0a15" />
                    <circle cx="24" cy="20" r="3" fill="#0a0a15" />
                    <!-- Headlights casting beams -->
                    <circle cx="32" cy="13" r="2" fill="#ffffaa" opacity="0.8" />
                    <polygon points="32,13 60,5 60,22" fill="#ffffaa" opacity="0.06" />
                </g>

                <!-- Desert ground -->
                <path
                    d="M0 420 Q100 410 200 415 Q300 420 400 412 Q500 405 600 410 Q700 415 800 408 L800 600 L0 600 Z"
                    fill="#2a1f14"
                />
                <path
                    d="M0 450 Q150 440 300 445 Q450 450 600 442 Q700 438 800 445 L1000 445 L1000 600 L0 600 Z"
                    fill="#1a1208"
                />

                <!-- ===== GROUND SCORCH MARK (where cow was standing) ===== -->
                <g transform="translate(500, 455)">
                    <ellipse cx="0" cy="0" rx="45" ry="12" fill="url(#scorchGlow)" class="scorch-glow" />
                    <ellipse cx="0" cy="0" rx="30" ry="8" fill="#1a0f08" opacity="0.6" />
                    <!-- Scorch lines radiating outward -->
                    <line x1="-25" y1="0" x2="-40" y2="-3" stroke="#3a2a1a" stroke-width="1" opacity="0.4" />
                    <line x1="25" y1="0" x2="40" y2="3" stroke="#3a2a1a" stroke-width="1" opacity="0.4" />
                    <line x1="0" y1="-8" x2="3" y2="-15" stroke="#3a2a1a" stroke-width="1" opacity="0.3" />
                    <line x1="-15" y1="6" x2="-25" y2="12" stroke="#3a2a1a" stroke-width="1" opacity="0.3" />
                    <line x1="15" y1="6" x2="25" y2="12" stroke="#3a2a1a" stroke-width="1" opacity="0.3" />
                    <!-- Displaced rocks -->
                    <ellipse cx="-35" cy="2" rx="4" ry="2.5" fill="#3a2a1a" opacity="0.7" />
                    <ellipse cx="30" cy="-1" rx="3" ry="2" fill="#3a2a1a" opacity="0.6" />
                    <ellipse cx="15" cy="10" rx="2.5" ry="1.5" fill="#3a2a1a" opacity="0.5" />
                    <!-- Tuft of uprooted grass -->
                    <path d="M-20 5 Q-25 -5 -18 -10" stroke="#2a4a1a" stroke-width="1.5" fill="none" opacity="0.5" />
                    <path d="M-15 6 Q-20 -3 -12 -8" stroke="#2a4a1a" stroke-width="1.5" fill="none" opacity="0.4" />
                </g>

                <!-- Rocky outcroppings -->
                <ellipse cx="150" cy="448" rx="25" ry="8" fill="#2a1f14" opacity="0.8" />
                <ellipse cx="700" cy="447" rx="20" ry="7" fill="#2a1f14" opacity="0.75" />

                <!-- Cactus silhouettes -->
                <g fill="#0d0a05" opacity="0.8">
                    <rect x="80" y="400" width="6" height="50" rx="3" />
                    <rect x="72" y="410" width="6" height="20" rx="3" />
                    <rect x="82" y="415" width="6" height="15" rx="3" />
                    <rect x="720" y="410" width="5" height="40" rx="2.5" />
                    <rect x="712" y="418" width="5" height="15" rx="2.5" />
                    <rect x="723" y="415" width="5" height="18" rx="2.5" />
                    <rect x="880" y="405" width="5" height="35" rx="2.5" />
                    <rect x="873" y="412" width="5" height="12" rx="2.5" />
                    <rect x="885" y="410" width="5" height="14" rx="2.5" />
                </g>

                <!-- Area 51 fence line -->
                <g stroke="#3a2a1a" stroke-width="2" opacity="0.6">
                    <line x1="0" y1="430" x2="300" y2="430" />
                    <line x1="100" y1="430" x2="100" y2="445" />
                    <line x1="150" y1="430" x2="150" y2="445" />
                    <line x1="200" y1="430" x2="200" y2="445" />
                    <line x1="250" y1="430" x2="250" y2="445" />
                    <line x1="300" y1="430" x2="300" y2="445" />
                </g>

                <!-- Area 51 sign -->
                <g transform="translate(180, 415)">
                    <rect x="0" y="0" width="50" height="18" rx="2" fill="#cc3333" stroke="#aa2222" stroke-width="1" />
                    <text
                        x="25"
                        y="13"
                        text-anchor="middle"
                        font-family="Arial, sans-serif"
                        font-size="7"
                        fill="#ffffff"
                        font-weight="bold"
                    >
                        AREA 51
                    </text>
                    <rect x="22" y="18" width="6" height="12" fill="#555" />
                </g>

                <!-- Roswell sign -->
                <g transform="translate(720, 420)">
                    <rect x="0" y="0" width="70" height="22" rx="3" fill="#1a3a5a" stroke="#0a2a4a" stroke-width="1" />
                    <text
                        x="35"
                        y="10"
                        text-anchor="middle"
                        font-family="Arial, sans-serif"
                        font-size="7"
                        fill="#88ccff"
                        font-weight="bold"
                    >
                        ROSWELL
                    </text>
                    <text
                        x="35"
                        y="19"
                        text-anchor="middle"
                        font-family="Arial, sans-serif"
                        font-size="6"
                        fill="#66aadd"
                    >
                        NEW MEXICO
                    </text>
                    <rect x="32" y="22" width="6" height="10" fill="#444" />
                </g>

                <!-- ===== ABDUCTION BEAM (originates at UFO bottom, widens to ground) ===== -->
                <!-- Beam outer glow -->
                <polygon
                    class="beam"
                    points="455,160 545,160 620,460 380,460"
                    fill="url(#beamGrad)"
                    filter="url(#softGlow)"
                />
                <!-- Beam core -->
                <polygon class="beam-core" points="470,160 530,160 580,460 420,460" fill="#66ffbb" opacity="0.12" />
                <!-- Beam center streak -->
                <polygon points="488,160 512,160 530,460 470,460" fill="#88ffcc" opacity="0.08" />

                <!-- Beam energy tendrils escaping edges -->
                <path
                    d="M455,200 Q430,250 410,300 Q390,350 400,380"
                    stroke="#44ffaa"
                    stroke-width="2"
                    fill="none"
                    opacity="0.15"
                    filter="url(#glow)"
                />
                <path
                    d="M545,200 Q570,250 590,300 Q610,350 600,380"
                    stroke="#44ffaa"
                    stroke-width="2"
                    fill="none"
                    opacity="0.15"
                    filter="url(#glow)"
                />
                <path
                    d="M465,250 Q440,300 425,350 Q415,390 420,420"
                    stroke="#44ffaa"
                    stroke-width="1.5"
                    fill="none"
                    opacity="0.1"
                    filter="url(#glow)"
                />
                <path
                    d="M535,250 Q560,300 575,350 Q585,390 580,420"
                    stroke="#44ffaa"
                    stroke-width="1.5"
                    fill="none"
                    opacity="0.1"
                    filter="url(#glow)"
                />

                <!-- Beam rings at ground level -->
                <ellipse
                    cx="500"
                    cy="455"
                    rx="110"
                    ry="10"
                    fill="none"
                    stroke="#44ffaa"
                    stroke-width="1.5"
                    opacity="0.35"
                />
                <ellipse
                    cx="500"
                    cy="420"
                    rx="80"
                    ry="8"
                    fill="none"
                    stroke="#44ffaa"
                    stroke-width="1"
                    opacity="0.25"
                />
                <ellipse cx="500" cy="380" rx="55" ry="6" fill="none" stroke="#44ffaa" stroke-width="1" opacity="0.2" />
                <ellipse
                    cx="500"
                    cy="340"
                    rx="35"
                    ry="4"
                    fill="none"
                    stroke="#44ffaa"
                    stroke-width="1"
                    opacity="0.15"
                />

                <!-- ===== MID-LIFT COW (front legs up, body tilted, bristled tail, green glow underneath) ===== -->
                <g transform="translate(465, 310) rotate(-5, 40, 30)">
                    <!-- Green glow underneath from beam shining up -->
                    <ellipse cx="40" cy="55" rx="40" ry="12" fill="#44ffaa" opacity="0.15" filter="url(#glow)" />

                    <!-- Cow body (tilted slightly upward) -->
                    <ellipse cx="40" cy="25" rx="35" ry="22" fill="#f5f0e8" />
                    <!-- Spots -->
                    <ellipse cx="25" cy="20" rx="10" ry="9" fill="#222" />
                    <ellipse cx="55" cy="28" rx="7" ry="6" fill="#222" />
                    <ellipse cx="40" cy="15" rx="5" ry="4" fill="#222" />
                    <!-- Green glow cast on belly from beam -->
                    <ellipse cx="40" cy="35" rx="25" ry="10" fill="#44ffaa" opacity="0.12" />

                    <!-- BACK LEGS (still on ground, slightly bent from strain) -->
                    <path
                        d="M22 40 Q18 52 15 58"
                        stroke="#f5f0e8"
                        stroke-width="5"
                        fill="none"
                        stroke-linecap="round"
                    />
                    <path
                        d="M34 40 Q30 52 28 58"
                        stroke="#f5f0e8"
                        stroke-width="5"
                        fill="none"
                        stroke-linecap="round"
                    />
                    <!-- Back hooves -->
                    <ellipse cx="15" cy="59" rx="3" ry="2" fill="#ddd" />
                    <ellipse cx="28" cy="59" rx="3" ry="2" fill="#ddd" />

                    <!-- FRONT LEGS (lifted upward, dangling) -->
                    <path d="M52 30 Q58 15 62 8" stroke="#f5f0e8" stroke-width="5" fill="none" stroke-linecap="round" />
                    <path
                        d="M64 32 Q70 18 74 10"
                        stroke="#f5f0e8"
                        stroke-width="5"
                        fill="none"
                        stroke-linecap="round"
                    />
                    <!-- Front hooves -->
                    <ellipse cx="63" cy="6" rx="3" ry="2" fill="#ddd" />
                    <ellipse cx="75" cy="8" rx="3" ry="2" fill="#ddd" />

                    <!-- Head (tilted up toward UFO) -->
                    <ellipse cx="78" cy="5" rx="13" ry="11" fill="#f5f0e8" />
                    <!-- Eyes (wide, surprised, pupils looking straight up) -->
                    <circle cx="85" cy="2" r="3.5" fill="white" />
                    <circle cx="85" cy="2" r="1.8" fill="black" />
                    <circle cx="73" cy="2" r="3.5" fill="white" />
                    <circle cx="73" cy="2" r="1.8" fill="black" />
                    <!-- Pupils looking UP at UFO -->
                    <circle cx="85" cy="0" r="1" fill="black" />
                    <circle cx="73" cy="0" r="1" fill="black" />
                    <!-- Ears (flattened back from tension) -->
                    <ellipse cx="66" cy="-1" rx="5" ry="3" fill="#f5f0e8" transform="rotate(-15, 66, -1)" />
                    <ellipse cx="88" cy="-1" rx="5" ry="3" fill="#f5f0e8" transform="rotate(15, 88, -1)" />
                    <ellipse cx="66" cy="-1" rx="3" ry="2" fill="#dda0a0" transform="rotate(-15, 66, -1)" />
                    <ellipse cx="88" cy="-1" rx="3" ry="2" fill="#dda0a0" transform="rotate(15, 88, -1)" />
                    <!-- Horns -->
                    <path d="M66 -4 Q62 -12 59 -15" stroke="#ddd" stroke-width="2.5" fill="none" />
                    <path d="M88 -4 Q92 -12 95 -15" stroke="#ddd" stroke-width="2.5" fill="none" />
                    <!-- Nose -->
                    <ellipse cx="78" cy="12" rx="7" ry="4.5" fill="#dda0a0" />
                    <circle cx="75" cy="12" r="1.2" fill="#bb8888" />
                    <circle cx="81" cy="12" r="1.2" fill="#bb8888" />
                    <!-- Mouth (slightly open in surprise) -->
                    <path d="M73 16 Q78 18 83 16" stroke="#bb8888" stroke-width="1" fill="none" />

                    <!-- Tail (BRISTLED/UPWARD from tension) -->
                    <path d="M5 20 Q-5 10 -8 0 Q-10 -8 -5 -5" stroke="#f5f0e8" stroke-width="2.5" fill="none" />
                    <!-- Bristle hairs -->
                    <path d="M-8 0 Q-12 -5 -10 -8" stroke="#f5f0e8" stroke-width="1.5" fill="none" />
                    <path d="M-8 0 Q-14 -3 -12 -6" stroke="#f5f0e8" stroke-width="1.5" fill="none" />
                    <path d="M-5 -5 Q-8 -10 -6 -12" stroke="#f5f0e8" stroke-width="1.5" fill="none" />
                    <!-- Tail tuft -->
                    <ellipse cx="-4" cy="-6" rx="3" ry="2.5" fill="#222" />
                </g>

                <!-- ===== UFO (centered above beam origin) ===== -->
                <g transform="translate(500, 140)">
